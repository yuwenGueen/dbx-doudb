name: Release DouDB
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Package unsigned macOS ARM64 candidate
        run: npx --yes @dbx-app/plugin-cli@0.1.9 package . --target darwin-arm64
      - name: Verify package identity and generate release metadata
        run: node scripts/release-metadata.mjs
      - name: Publish immutable candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f "docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This release already exists. Published assets must not be overwritten."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.dbxp dist/*.artifact.json dist/release-candidates.json \
            --verify-tag --title "DouDB ${RELEASE_TAG}" --notes-file "docs/releases/${RELEASE_TAG}.md"
